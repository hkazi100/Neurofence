<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | RNIDS - Real-Time Network Intrusion Detection</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
   
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    .navbar {
      background: rgba(255,255,255,0.1) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .navbar-brand, .nav a {
      color: white !important;
    }
    .profile-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-top: 50px;
    }
    .profile-icon {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      font-size: 50px;
      color: white;
    }
    .profile-info {
      padding: 20px 0;
      border-bottom: 1px solid #eee;
    }
    .profile-info:last-child {
      border-bottom: none;
    }
    .profile-info i {
      width: 40px;
      color: #667eea;
      font-size: 20px;
    }
    .profile-info h5 {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .profile-info p {
      color: #333;
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }
    .btn-logout {
      background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
      border: none;
      padding: 12px 40px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      margin-top: 20px;
    }
    .footer {
      background: rgba(0,0,0,0.3);
      color: white;
      padding: 30px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('landing') }}">
        <i class="fas fa-shield-alt"></i> RNIDS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('landing') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('capture') }}">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Profile Section -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="profile-card">
          <div class="text-center">
            <div class="profile-icon">
              <i class="fas fa-user"></i>
            </div>
            <h2>User Profile</h2>
            <p class="text-muted">Manage your account</p>
          </div>
          
          <div class="profile-info d-flex align-items-center">
            <i class="fas fa-user"></i>
            <div>
              <h5>Username</h5>
              <p>{{ username }}</p>
            </div>
          </div>
          
          <div class="profile-info d-flex align-items-center">
            <i class="fas fa-envelope"></i>
            <div>
              <h5>Email Address</h5>
              <p>{{ email }}</p>
            </div>
          </div>
          
          <div class="profile-info d-flex align-items-center">
            <i class="fas fa-id-card"></i>
            <div>
              <h5>Full Name</h5>
              <p>{{ fullname or 'Not set' }}</p>
            </div>
          </div>
          
          <div class="text-center">
            <a href="{{ url_for('logout') }}" class="btn btn-logout">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer text-center">
    <div class="container">
      <p>&copy; 2025 RNIDS. Real-Time Network Intrusion Detection System.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
