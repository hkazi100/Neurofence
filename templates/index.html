<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Chart -->
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Network Flow Chart</h3>
          </div>
<div class="card-body">
            <div class="row">
              <div class="col-md-8">
                <div class="chart-container" style="height:300px;">
                  <canvas id="myChart"></canvas>
                </div>
              </div>
              <div class="col-md-4">
                <div class="stats-panel">
                  <h5><i class="fas fa-shield-alt"></i> Live Statistics</h5>
                  <div class="stat-item">
                    <span>Total Flows:</span>
                    <span id="total-flows" class="badge badge-primary">0</span>
                  </div>
                  <div class="stat-item">
                    <span>Benign:</span>
                    <span id="benign-count" class="badge badge-success">0</span>
                  </div>
                  <div class="stat-item">
                    <span>Threats:</span>
                    <span id="threat-count" class="badge badge-danger">0</span>
                  </div>
                  <div class="stat-item">
                    <span>Last Update:</span>
                    <span id="last-update" class="text-muted">--:--:--</span>
                  </div>
                </div>
              </div>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <script>
            var flowCount = 0;
            var benignCount = 0;
            var threatCount = 0;
            
            function updateStats() {
                document.getElementById("total-flows").innerText = flowCount;
                document.getElementById("benign-count").innerText = benignCount;
                document.getElementById("threat-count").innerText = threatCount;
                document.getElementById("last-update").innerText = new Date().toLocaleTimeString();
            }
            
            // Initialize chart
            var ctx = document.getElementById("myChart");
            if(ctx) {
                var chart = new Chart(ctx.getContext("2d"), {
                    type: "line",
                    data: {
                        labels: [],
                        datasets: [{
                            label: "Network Traffic (Flows/sec)",
                            data: [],
                            borderColor: "#4CAF50",
                            backgroundColor: "rgba(76, 175, 80, 0.1)",
                            fill: true,
                            tension: 0.4
                        }, {
                            label: "Threats Detected",
                            data: [],
                            borderColor: "#f44336",
                            backgroundColor: "rgba(244, 67, 54, 0.1)",
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: "top" }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
                
                // Polling for data
                setInterval(function() {
                    fetch("/get-data").then(r=>r.json()).then(function(d) {
                        if(d && d.result) {
                            flowCount++;
                            if(d.result[6] === "Benign") benignCount++;
                            else threatCount++;
                            
                            updateStats();
                            
                            // Update chart with time
                            var time = new Date().toLocaleTimeString();
                            chart.data.labels.push(time);
                            chart.data.datasets[0].data.push(d.ips[0].count);
                            chart.data.datasets[1].data.push(threatCount);
                            
                            // Keep only last 20 points
                            if(chart.data.labels.length > 20) {
                                chart.data.labels.shift();
                                chart.data.datasets[0].data.shift();
                                chart.data.datasets[1].data.shift();
                            }
                            chart.update();
                        }
                    });
                }, 3000);
            }
            </script>
          </div>
            <script>
            // Create chart directly in HTML
            setTimeout(function() {
                var ctx = document.getElementById("myChart");
                if(ctx) {
                    var chart = new Chart(ctx, {
                        type: "bar",
                        data: {
                            labels: ["IP"],
                            datasets: [{
                                label: "Flows",
                                data: [1],
                                backgroundColor: "#4CAF50"
                            }]
                        },
                        options: {
                            animation: false
                        }
                    });
                    
                    // Start polling immediately
                    setInterval(function() {
                        fetch("/get-data").then(r=>r.json()).then(function(d){
                            if(d && d.ips && d.ips.length > 0) {
                                var labels = d.ips.map(function(x){return x.SourceIP});
                                var counts = d.ips.map(function(x){return x.count});
                                chart.data.labels = labels;
                                chart.data.datasets[0].data = counts;
                                chart.update();
                                
                                // Add to table - find table and add row
                                var table = document.getElementById("details");
                                if(table) {
                                    var row = table.insertRow(1);
                                    row.innerHTML = "<td>1</td><td>" + d.result[1] + "</td><td>" + d.result[2] + "</td><td>" + d.result[3] + "</td><td>" + d.result[4] + "</td><td>" + d.result[5] + "</td><td></td><td></td><td></td><td></td><td>" + d.result[6] + "</td><td>" + d.result[7] + "</td><td></td><td></td>";
                                }
                            }
                        });
                    }, 3000);
                }
            }, 500);
            </script>
          </div>
        </div>
      </div>
    </div>

    <!-- Captured Flow Table -->
    <div class="row mt-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <div class="row">
              <div class="col-md-6">
                <h3 class="card-title">Captured Flow</h3>
              </div>
              <div class="col-md-6 text-right">
                <div class="filter-group">
                  <select id="risk-filter" class="form-control custom-filter">
                    <option value="All">All Risks</option>
                    <option value="Minimal">Minimal Risk</option>
                    <option value="Low">Low Risk</option>
                    <option value="Medium">Medium Risk</option>
                    <option value="High">High Risk</option>
                    <option value="Very High">Very High Risk</option>
                  </select>
                  <span id="filtered-count-container">
                    <span id="filtered-count">0</span> flows
                  </span>
                  <button id="download-report" class="btn btn-primary" title="Download Report">
                    <i class="fas fa-download me-2"></i> Download Report
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover" id="details">
                <!-- Table rows will be populated dynamically -->
                <tr>
                  <th>Flow ID</th>
                  <th>Src IP</th>
                  <th>Src Port</th>
                  <th>Dst IP</th>
                  <th>Dst Port</th>
                  <th>Protocol</th>
                  <th>Flow Start</th>
                  <th>Flow End</th>
                  <th>App Name</th>
                  <th>PID</th>
                  <th>Prediction</th>
                  <th>Prob</th>
                  <th>Risk</th>
                  <th>Details</th>
                </tr>
                <!-- Data rows will be added here -->
              </table>
            </div>
            <div class="text-center mt-3">
              <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center" id="pagination">
                  <!-- Pagination will be populated dynamically -->
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
